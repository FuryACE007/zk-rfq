[package]
name = "zk-rfq-solver"
version = "0.1.0"
edition = "2021"
description = """
Sepolia / Uniswap V3 JIT solver for the ZK-RFQ Sovereign Gateway.

This solver:
  1. Queries the gateway for active ERC-7683 intents
  2. Fetches a JIT price from Uniswap V3 on Ethereum Sepolia
  3. Generates a Noir ZK proof (aggregate_derivation)
  4. Submits a bid to the gateway / Essential server for settlement
"""

[dependencies]
# Essential Protocol SDK
essential-types = { git = "https://github.com/essential-contributions/essential-base", branch = "main" }

# HTTP client (for Essential REST API + DEX price feeds)
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }

# Async runtime
tokio = { version = "1.38", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Crypto (keccak256 commitments)
sha2 = "0.10"
hex = "0.4"
rand = "0.8"

# CLI
clap = { version = "4.5", features = ["derive", "env"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Time
chrono = "0.4"

# Error handling
anyhow = "1.0"

# EVM RPC (Uniswap V3 QuoterV2 on Sepolia)
alloy = { version = "1", features = ["provider-http", "sol-types", "contract"] }
